<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Salary Prediction</title>

    <link
      href="https://fonts.googleapis.com/css?family=Arimo"
      rel="stylesheet"
      type="text/css"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <div class="login">
      <h1>Predict Salary Analysis</h1>

      <!-- Main Input For Receiving Query to our ML -->
      <form action="{{ url_for('predict') }}" method="post">
        <!-- Experience -->
        <input
          type="number"
          name="experience"
          placeholder="Experience (Years)"
          step="0.1"
          min="0"
          required="required"
        />

        <!-- Test Score -->
        <input
          type="number"
          name="test_score"
          placeholder="Test Score (out of 100)"
          min="0"
          max="100"
          required="required"
        />

        <!-- Interview Score -->
        <input
          type="number"
          name="interview_score"
          placeholder="Interview Score (out of 100)"
          min="0"
          max="100"
          required="required"
        />

        <button type="submit" class="btn btn-primary btn-block btn-large">
          Predict Salary
        </button>
      </form>

      <br />
      <br />

      <!-- Prediction Result -->
      <div class="prediction">{{ prediction_text }}</div>
    </div>
  </body>
</html>
